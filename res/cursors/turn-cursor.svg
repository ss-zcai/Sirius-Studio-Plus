<?xml version="1.0" encoding="UTF-8"?>
<!--
  The turning cursor over a knob in the image viewers.

  The artboard is the cursor: 32 x 32 pixels. Only the shapes' outlines
  are read - path, polygon, rect, circle; the app fills them white and
  edges them with one black pixel, so colours set here are ignored.

  Crisp edges: the black edge is centred on the outline, so a straight
  edge on a half pixel (16.5) is one clean pixel; on a whole pixel it is
  greyed across two.

  The hot spot - the point that grabs - is the circle named "hotspot",
  not drawn; without one, the middle of the artboard. Keep shapes
  unrotated and untransformed (in Illustrator, Object > Expand first).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <path d="M16.5,6.5 A11,11 0 1 1 5.875,20.347 L10.704,19.053 A6,6 0 1 0 16.5,11.5 L16.5,15.5 L8.5,9 L16.5,2.5 Z" fill="#fff" stroke="#000" stroke-width="1" />
  <circle id="hotspot" cx="16.5" cy="17.5" r="0.5" fill="none" stroke="none" />
</svg>
